// Admin can explicitly mark a profile Verified (green tick, customer sees it) or
// Unverified (red mark, customer sees it) -- independent actions, not a single toggle,
// so admin can flag a problem profile as Unverified without it looking like "not yet reviewed".
function setCustomerVerification(id, status){
  const c = CUSTOMERS.find(x => x.id === id);
  if(!c) return;
  c.verificationStatus = status;
  saveCustomers();
  renderAdmin();
}

// Lets admin correct a customer's own typed details (name, mobile, emergency contact, address)
// -- e.g. if they mistyped a digit at signup.
function updateCustomerField(id, field, val){
  const c = CUSTOMERS.find(x => x.id === id);
  if(!c) return;
  const v = val.trim();
  if(field === 'mobile' || field === 'emergency'){
    if(!/^\d{10}$/.test(v)){
      alert('Please enter a valid 10-digit number.');
      renderAdmin();
      return;
    }
  } else if(field === 'email'){
    if(v && CUSTOMERS.some(x => x.id !== id && x.email === v.toLowerCase())){
      alert('Another customer already uses this email.');
      renderAdmin();
      return;
    }
    c[field] = v.toLowerCase();
    saveCustomers();
    renderAdmin();
    return;
  } else if(!v){
    alert('This field cannot be empty.');
    renderAdmin();
    return;
  }
  c[field] = v;
  saveCustomers();
  renderAdmin();
}

// Lets admin replace a customer's uploaded document/selfie photo -- e.g. if the customer's
// original upload came out blurred or unreadable, admin can swap in a clearer copy.
function adminReplaceCustomerDoc(id, key, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const c = CUSTOMERS.find(x => x.id === id);
    if(!c) return;
    c[key] = e.target.result;
    saveCustomers();
    renderAdmin();
  };
  reader.readAsDataURL(file);
}

/* ============ DOCUMENT EDITOR (crop / rotate / straighten) ============
   Many customers upload KYC photos crooked or sideways. This lets admin fix them
   in-app instead of asking the customer to re-upload. baseCanvas always holds the
   fully-baked current image (no pending rotation); `editorAngle` is a live fine-rotate
   (-45..45 deg) previewed on top of baseCanvas but not yet baked in. */
let docEditor = null; // { customerId, fieldKey, baseCanvas, angle, crop: {x,y,w,h}|null, dragStart }

function openDocEditor(customerId, fieldKey){
  const c = CUSTOMERS.find(x => x.id === customerId);
  if(!c || !c[fieldKey]) return;
  const img = new Image();
  img.onload = () => {
    const base = document.createElement('canvas');
    base.width = img.naturalWidth;
    base.height = img.naturalHeight;
    base.getContext('2d').drawImage(img, 0, 0);
    docEditor = { customerId, fieldKey, baseCanvas: base, angle: 0, crop: null, dragStart: null };
    renderDocEditorModal();
  };
  img.onerror = () => alert('Could not load this image for editing.');
  img.src = c[fieldKey];
}

function closeDocEditor(){
  docEditor = null;
  const el = document.getElementById('doceditor-overlay');
  if(el) el.remove();
}

// Renders a canvas rotated by `angleDeg` around its center, expanding the canvas so
// nothing is clipped. Used both for live straighten preview and for baking rotations in.
function rotatedCanvas(srcCanvas, angleDeg){
  const rad = angleDeg * Math.PI / 180;
  const w = srcCanvas.width, h = srcCanvas.height;
  const newW = Math.abs(w * Math.cos(rad)) + Math.abs(h * Math.sin(rad));
  const newH = Math.abs(w * Math.sin(rad)) + Math.abs(h * Math.cos(rad));
  const out = document.createElement('canvas');
  out.width = Math.round(newW);
  out.height = Math.round(newH);
  const ctx = out.getContext('2d');
  ctx.translate(out.width / 2, out.height / 2);
  ctx.rotate(rad);
  ctx.drawImage(srcCanvas, -w / 2, -h / 2);
  return out;
}

function renderDocEditorModal(){
  let overlay = document.getElementById('doceditor-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'doceditor-overlay';
    overlay.className = 'doceditor-overlay';
    document.body.appendChild(overlay);
  }
  const fieldLabel = (DOC_FIELDS.find(f => f.key === docEditor.fieldKey) || {}).label || 'Document';
  overlay.innerHTML = `
    <div class="doceditor-modal">
      <h3>Edit: ${fieldLabel}</h3>
      <p class="field-hint">Rotate, straighten or crop this photo.</p>
      <div class="doceditor-canvas-wrap" id="doceditor-canvas-wrap"></div>
      <div class="doceditor-row">
        <button onclick="docEditorRotate90(-1)">⟲ Rotate left</button>
        <button onclick="docEditorRotate90(1)">⟳ Rotate right</button>
      </div>
      <div class="doceditor-slider-row">
        <label><span>Straighten</span><span id="doceditor-angle-val">${docEditor.angle}°</span></label>
        <input type="range" min="-45" max="45" step="0.5" value="${docEditor.angle}" oninput="docEditorSetAngle(this.value)">
      </div>
      <div class="doceditor-row">
        <button id="doceditor-apply-crop" onclick="docEditorApplyCrop()" ${docEditor.crop ? '' : 'disabled'}>✂ Apply crop</button>
        <button onclick="docEditorReset('${docEditor.customerId}','${docEditor.fieldKey}')">↺ Reset all</button>
      </div>
      <p class="doceditor-hint">Drag on the photo to draw a crop box, then tap "Apply crop". Use the slider to straighten a tilted scan, and the rotate buttons for a sideways/upside-down photo.</p>
      <div class="doceditor-row">
        <button class="btn-primary" style="flex:1;" onclick="docEditorSave()">Save</button>
        <button class="btn-ghost" style="flex:1;" onclick="closeDocEditor()">Cancel</button>
      </div>
    </div>
  `;
  docEditorMountCanvas();
}

function docEditorMountCanvas(){
  const wrap = document.getElementById('doceditor-canvas-wrap');
  if(!wrap) return;
  wrap.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.id = 'doceditor-canvas';
  wrap.appendChild(canvas);
  docEditorRedraw();
  canvas.addEventListener('pointerdown', docEditorPointerDown);
  canvas.addEventListener('pointermove', docEditorPointerMove);
  canvas.addEventListener('pointerup', docEditorPointerUp);
  canvas.addEventListener('pointercancel', docEditorPointerUp);
}

function docEditorRedraw(){
  const canvas = document.getElementById('doceditor-canvas');
  if(!canvas || !docEditor) return;
  const preview = docEditor.angle !== 0 ? rotatedCanvas(docEditor.baseCanvas, docEditor.angle) : docEditor.baseCanvas;
  // Cap the working resolution so huge phone photos stay smooth to edit; display scales via CSS.
  const MAX_DIM = 900;
  const scale = Math.min(1, MAX_DIM / Math.max(preview.width, preview.height));
  canvas.width = Math.round(preview.width * scale);
  canvas.height = Math.round(preview.height * scale);
  canvas._srcScale = scale; // remember so crop coords map back to `preview` pixels
  canvas._previewRef = preview;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(preview, 0, 0, canvas.width, canvas.height);
  if(docEditor.crop){
    const r = docEditor.crop;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.clearRect(r.x, r.y, r.w, r.h);
    ctx.drawImage(preview, r.x / scale, r.y / scale, r.w / scale, r.h / scale, r.x, r.y, r.w, r.h);
    ctx.strokeStyle = '#F5C21B';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.restore();
  }
}

function docEditorCanvasPoint(evt){
  const canvas = document.getElementById('doceditor-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.max(0, Math.min(canvas.width, (evt.clientX - rect.left) * scaleX)),
    y: Math.max(0, Math.min(canvas.height, (evt.clientY - rect.top) * scaleY)),
  };
}

function docEditorPointerDown(evt){
  evt.preventDefault();
  evt.target.setPointerCapture(evt.pointerId);
  const p = docEditorCanvasPoint(evt);
  docEditor.dragStart = p;
  docEditor.crop = { x: p.x, y: p.y, w: 0, h: 0 };
}

function docEditorPointerMove(evt){
  if(!docEditor || !docEditor.dragStart) return;
  evt.preventDefault();
  const p = docEditorCanvasPoint(evt);
  const s = docEditor.dragStart;
  docEditor.crop = {
    x: Math.min(s.x, p.x), y: Math.min(s.y, p.y),
    w: Math.abs(p.x - s.x), h: Math.abs(p.y - s.y),
  };
  docEditorRedraw();
}

function docEditorPointerUp(evt){
  if(!docEditor) return;
  docEditor.dragStart = null;
  if(docEditor.crop && (docEditor.crop.w < 8 || docEditor.crop.h < 8)){
    docEditor.crop = null; // treat a tap/tiny drag as "no selection", not an accidental crop
  }
  const btn = document.getElementById('doceditor-apply-crop');
  if(btn) btn.disabled = !docEditor.crop;
  docEditorRedraw();
}

function docEditorSetAngle(val){
  docEditor.angle = parseFloat(val);
  docEditor.crop = null; // a stale selection wouldn't line up after re-angling
  const lbl = document.getElementById('doceditor-angle-val');
  if(lbl) lbl.textContent = `${docEditor.angle}°`;
  const btn = document.getElementById('doceditor-apply-crop');
  if(btn) btn.disabled = true;
  docEditorRedraw();
}

function docEditorRotate90(dir){
  // Bake any pending straighten angle in first, then add a hard 90-degree turn.
  const baked = docEditor.angle !== 0 ? rotatedCanvas(docEditor.baseCanvas, docEditor.angle) : docEditor.baseCanvas;
  docEditor.baseCanvas = rotatedCanvas(baked, dir * 90);
  docEditor.angle = 0;
  docEditor.crop = null;
  renderDocEditorModal();
}

function docEditorApplyCrop(){
  if(!docEditor.crop) return;
  const canvas = document.getElementById('doceditor-canvas');
  const preview = canvas._previewRef;
  const scale = canvas._srcScale;
  const r = docEditor.crop;
  const cropped = document.createElement('canvas');
  cropped.width = Math.max(1, Math.round(r.w / scale));
  cropped.height = Math.max(1, Math.round(r.h / scale));
  cropped.getContext('2d').drawImage(
    preview, r.x / scale, r.y / scale, r.w / scale, r.h / scale,
    0, 0, cropped.width, cropped.height
  );
  docEditor.baseCanvas = cropped;
  docEditor.angle = 0;
  docEditor.crop = null;
  renderDocEditorModal();
}

function docEditorReset(customerId, fieldKey){
  openDocEditor(customerId, fieldKey);
}

function docEditorSave(){
  const final = docEditor.angle !== 0 ? rotatedCanvas(docEditor.baseCanvas, docEditor.angle) : docEditor.baseCanvas;
  const dataUrl = final.toDataURL('image/jpeg', 0.88);
  const c = CUSTOMERS.find(x => x.id === docEditor.customerId);
  if(c){
    c[docEditor.fieldKey] = dataUrl;
    saveCustomers();
  }
  closeDocEditor();
  renderAdmin();
}

// Lets admin modify an existing booking -- e.g. extend/shorten the rental dates, adjust the
// km plan description, or correct pricing/deposit -- after it's already been agreed to.
// Duration is recalculated automatically whenever a date/time field changes.
function updateBookingField(id, field, val){
  const bk = BOOKINGS.find(x => x.id === id);
  if(!bk) return;

  if(['rentalTotal','deposit','extraKmCharge','pickupCharge','dropCharge','helmetCharge'].includes(field)){
    const n = parseFloat(val);
    if(isNaN(n) || n < 0){
      alert('Please enter a valid, non-negative number.');
      renderAdmin();
      return;
    }
    bk[field] = n;
  } else if(field === 'kmLabel'){
    bk.kmLabel = val.trim();
  } else if(['pickupDate','pickupTime','dropDate','dropTime'].includes(field)){
    bk[field] = val;
    const hrs = hoursBetweenRaw(bk.pickupDate, bk.pickupTime, bk.dropDate, bk.dropTime);
    bk.durationLabel = hrs > 0 ? durationLabel(hrs) : 'Invalid dates -- check pickup/drop-off';
  } else {
    return;
  }

  bk.modifiedAt = new Date().toISOString();
  saveBookings();
  renderAdmin();
}

function dataUrlToFormat(dataUrl){
  if(!dataUrl) return 'JPEG';
  const m = /^data:image\/(\w+);/.exec(dataUrl);
  if(!m) return 'JPEG';
  const type = m[1].toUpperCase();
  if(type === 'JPG') return 'JPEG';
  if(type === 'PNG' || type === 'JPEG' || type === 'WEBP') return type;
  return 'JPEG';
}

function downloadCustomerPDF(id){
  ensureJsPDFThen(function(){ generateCustomerPDF(id); });
}

function generateCustomerPDF(id){
  const c = CUSTOMERS.find(x => x.id === id);
  if(!c) return;
  if(!window.jspdf){
    alert('PDF library did not load -- check your internet connection and try again.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 40;
  let y = 50;

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('24x7 Bike4u — Customer KYC Profile', margin, y);
  y += 26;

  doc.setDrawColor(200);
  doc.line(margin, y, pageW - margin, y);
  y += 24;

  const fields = [
    ['Name', c.name],
    ['Gmail', c.email],
    ['Mobile number', c.mobile],
    ['Emergency contact', c.emergency],
    ['Address (Indore)', c.address],
    ['Submitted on', fmtDate(c.createdAt.slice(0,10))],
    ['Verification status', verificationStatusOf(c) === 'verified' ? 'Verified' : verificationStatusOf(c) === 'unverified' ? 'Unverified' : 'Pending verification'],
  ];
  doc.setFontSize(11);
  fields.forEach(([label, value]) => {
    doc.setFont('helvetica', 'bold');
    doc.text(label + ':', margin, y);
    doc.setFont('helvetica', 'normal');
    const lines = doc.splitTextToSize(String(value), pageW - margin*2 - 150);
    doc.text(lines, margin + 150, y);
    y += Math.max(16, lines.length * 14);
  });

  y += 10;
  doc.setDrawColor(200);
  doc.line(margin, y, pageW - margin, y);
  y += 24;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text('Verification documents', margin, y);
  y += 20;

  const imgW = 230, imgH = 150, gap = 20;
  let x = margin;
  DOC_FIELDS.forEach((f, idx) => {
    if(y + imgH + 30 > doc.internal.pageSize.getHeight() - margin){
      doc.addPage();
      y = 50;
      x = margin;
    }
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.text(f.label, x, y);
    try{
      doc.addImage(c[f.key], dataUrlToFormat(c[f.key]), x, y + 6, imgW, imgH);
    }catch(e){
      doc.text('(image could not be embedded)', x, y + 20);
    }
    if(idx % 2 === 0){
      x = margin + imgW + gap;
    } else {
      x = margin;
      y += imgH + 34;
    }
  });

  doc.save(`Bike4u-KYC-${c.name.replace(/\s+/g,'_')}-${c.id}.pdf`);
}

function updateRate(id, km, val){
  const v = VEHICLES.find(x => x.id === id);
  const n = parseFloat(val);
  if(!isNaN(n) && n >= 0){ v.rate[km] = n; saveVehicles(); }
}
function updateField(id, field, val){
  const v = VEHICLES.find(x => x.id === id);
  const n = parseFloat(val);
  if(!isNaN(n) && n >= 0){ v[field] = n; saveVehicles(); }
}
function toggleHidden(id){
  const v = VEHICLES.find(x => x.id === id);
  v.hidden = !v.hidden;
  saveVehicles();
  renderAdmin();
}
function toggleSoldOut(id){
  const v = VEHICLES.find(x => x.id === id);
  v.soldOut = !v.soldOut;
  saveVehicles();
  renderAdmin();
}
function uploadPhoto(id, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const v = VEHICLES.find(x => x.id === id);
    v.photo = e.target.result;
    saveVehicles();
    renderAdmin();
  };
  reader.readAsDataURL(file);
}

/* ============ ADMIN: ADD VEHICLE ============ */
let newVehicleDraft = null;
let termsDraft = null; // null = not editing; string = draft text being edited

function blankDraft(){
  return { name:'', colour:'', rc:'', type:'scooter', rate120:'', rate150:'', rate200:'', half80:'', weekly:'', deposit:'', extraKm:'', photo:null };
}
function toggleAddForm(){
  newVehicleDraft = newVehicleDraft ? null : blankDraft();
  renderAdmin();
}
function setDraftType(t){
  newVehicleDraft.type = t;
  renderAdmin();
}
function draftPhotoUpload(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    newVehicleDraft.photo = e.target.result;
    renderAdmin();
  };
  reader.readAsDataURL(file);
}
function submitNewVehicle(){
  const d = newVehicleDraft;
  const errEl = document.getElementById('add-vehicle-err');
  const nums = [d.rate120, d.rate150, d.rate200, d.half80, d.weekly, d.deposit, d.extraKm];

  if(!d.name.trim() || !d.colour.trim() || !d.rc.trim()){
    errEl.textContent = 'Fill in vehicle name, colour and RC number.';
    errEl.style.display = 'block';
    return;
  }
  if(nums.some(n => n === '' || isNaN(parseFloat(n)) || parseFloat(n) < 0)){
    errEl.textContent = 'Enter valid, non-negative numbers for every pricing field.';
    errEl.style.display = 'block';
    return;
  }

  const maxNum = VEHICLES.reduce((m,v) => Math.max(m, parseInt(v.id.replace('V',''),10) || 0), 0);
  VEHICLES.push({
    id: 'V' + (maxNum + 1),
    name: d.name.trim(),
    colour: d.colour.trim(),
    rc: d.rc.trim(),
    type: d.type,
    rate: { 120: parseFloat(d.rate120), 150: parseFloat(d.rate150), 200: parseFloat(d.rate200) },
    half80: parseFloat(d.half80),
    weekly: parseFloat(d.weekly),
    deposit: parseFloat(d.deposit),
    extraKm: parseFloat(d.extraKm),
    photo: d.photo,
    hidden: false,
    soldOut: false,
  });

  saveVehicles();
  newVehicleDraft = null;
  renderAdmin();
}

/* ============ ROUTER ============ */
const VALID_PAGES = ['home','list','review','admin-login','admin','customer-signup','customer-login','customer-forgot','customer-account','terms','payment'];

function goTo(page){
  state.page = page;
  if(location.hash.slice(1) !== page){ location.hash = page; }
  render();
}
window.addEventListener('hashchange', function(){
  const p = location.hash.slice(1);
  if(p && VALID_PAGES.includes(p) && p !== state.page){
    state.page = p;
    render();
  }
});
function render(){
  if(state.page !== 'home' && (tourActive || document.getElementById('tour-tooltip'))){
    tourActive = false;
    removeTourUI();
  }
  renderSteps();
  if(state.page === 'home') renderHome();
  else if(state.page === 'list') renderList();
  else if(state.page === 'review') renderReview();
  else if(state.page === 'admin-login') renderAdminLogin();
  else if(state.page === 'admin') renderAdmin();
  else if(state.page === 'customer-signup') renderCustomerSignup();
  else if(state.page === 'customer-login') renderCustomerLogin();
  else if(state.page === 'customer-forgot') renderCustomerForgot();
  else if(state.page === 'customer-account') renderCustomerAccount();
  else if(state.page === 'terms') renderTermsPage();
  else if(state.page === 'payment') renderPaymentPage();
  const footerLink = document.getElementById('customer-footer-link');
  if(footerLink) footerLink.textContent = state.currentCustomer ? 'My account' : 'Login';
  const headerLoginBtn = document.getElementById('header-customer-login');
  if(headerLoginBtn){
    const unread = state.currentCustomer ? NOTIFICATIONS.filter(n => n.customerId === state.currentCustomer.id && !n.read).length : 0;
    headerLoginBtn.textContent = state.currentCustomer ? `My account${unread ? ` (${unread})` : ''}` : 'Login';
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============ GUIDED TOUR ============
   A short, dismissible walkthrough that highlights what to tap next on first visit to the
   home page -- vehicle type, dates, km plan, then Search. Shown once per browser (tracked
   in localStorage); replayable any time via the "Take a quick tour" link under the hero. */
const TOUR_STORAGE_KEY = 'bike4u_tour_seen_v1';
const HOME_TOUR_STEPS = [
  { selector: '.type-toggle', title: 'Step 1 · Choose your ride', text: 'Tap Scooter or Bike to start your search.' },
  { selector: '#pickupDate', title: 'Step 2 · Pickup date & time', text: 'Set when you want to pick up the vehicle.' },
  { selector: '#dropDate', title: 'Step 3 · Drop-off date & time', text: "Set when you'll bring it back." },
  { selector: '#km-section', title: 'Step 4 · Kilometres', text: 'Pick a km plan that fits your trip.' },
  { selector: '.btn-primary', title: 'Step 5 · Search', text: 'Tap here to see available vehicles and pricing.' },
];
let tourStepIndex = 0;
let tourActive = false;

function maybeStartHomeTour(){
  if(state.page !== 'home') return;
  let seen = null;
  try{ seen = localStorage.getItem(TOUR_STORAGE_KEY); }catch(e){}
  if(seen) return;
  tourStepIndex = 0;
  tourActive = true;
  setTimeout(showTourStep, 500); // let the home page finish painting first
}

function showTourStep(){
  removeTourUI();
  if(!tourActive || state.page !== 'home') return;
  while(tourStepIndex < HOME_TOUR_STEPS.length){
    const step = HOME_TOUR_STEPS[tourStepIndex];
    const el = document.querySelector(step.selector);
    if(el){ renderTourStep(el, step); return; }
    tourStepIndex++; // element not on screen right now (e.g. km chips before dates are valid) -- skip to the next step
  }
  endTour();
}

function renderTourStep(el, step){
  const rect = el.getBoundingClientRect();
  const pad = 6;

  const highlight = document.createElement('div');
  highlight.id = 'tour-highlight';
  highlight.style.cssText = `position:fixed;top:${rect.top-pad}px;left:${rect.left-pad}px;width:${rect.width+pad*2}px;height:${rect.height+pad*2}px;border:2px solid var(--yellow);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.6);z-index:9999;pointer-events:none;transition:top .25s ease,left .25s ease,width .25s ease,height .25s ease;`;
  document.body.appendChild(highlight);

  const spaceBelow = window.innerHeight - rect.bottom;
  const above = spaceBelow < 160;
  const tip = document.createElement('div');
  tip.id = 'tour-tooltip';
  const tipTop = above ? Math.max(12, rect.top - 12) : rect.bottom + 12;
  tip.style.cssText = `position:fixed;${above ? `bottom:${window.innerHeight - tipTop}px;` : `top:${tipTop}px;`}left:${Math.max(12, Math.min(rect.left, window.innerWidth-300))}px;width:270px;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;padding:14px 16px;z-index:10000;box-shadow:0 8px 20px rgba(0,0,0,.45);color:var(--text);font-family:inherit;`;
  tip.innerHTML = `
    <div style="font-weight:700;margin-bottom:4px;">${step.title}</div>
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px;">${step.text}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:11px;color:var(--text-faint);">Step ${tourStepIndex+1} of ${HOME_TOUR_STEPS.length}</span>
      <div style="display:flex;gap:8px;">
        <button onclick="skipTour()" style="background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;padding:6px 4px;">Skip</button>
        <button onclick="nextTourStep()" class="btn-primary" style="margin:0;width:auto;padding:7px 14px;font-size:12.5px;">${tourStepIndex === HOME_TOUR_STEPS.length-1 ? 'Done' : 'Next'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(tip);
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function nextTourStep(){ tourStepIndex++; showTourStep(); }
function skipTour(){ endTour(); }
function endTour(){
  tourActive = false;
  removeTourUI();
  try{ localStorage.setItem(TOUR_STORAGE_KEY, '1'); }catch(e){}
}
function removeTourUI(){
  ['tour-highlight','tour-tooltip'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.remove();
  });
}
function restartTour(){
  try{ localStorage.removeItem(TOUR_STORAGE_KEY); }catch(e){}
  maybeStartHomeTour();
}

/* ============ INIT ============ */
(function init(){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  state.pickupDate = now.toISOString().slice(0,10);
  state.pickupTime = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const drop = new Date(now.getTime() + 24*3600*1000);
  state.dropDate = drop.toISOString().slice(0,10);
  state.dropTime = state.pickupTime;
  syncKmPackage(getPlan()); // default to the lowest available km option, not a fixed 150km
  restoreCustomerSession();
  restoreAdminSession();
  const initialHash = location.hash.slice(1);
  if(initialHash && VALID_PAGES.includes(initialHash)){
    state.page = initialHash;
  } else {
    location.hash = state.page;
  }
  render();
  syncFromSupabase();
  maybeStartHomeTour();

  // Keep the admin Fleet view's "Rented until.../Available now" badges accurate even
  // when nothing else changes -- a vehicle becomes free purely because time passed, not
  // because any booking record was edited, so a periodic re-render is needed to catch it.
  setInterval(() => {
    checkOverdueBookings();
    syncFromSupabase(); // periodic pull so new signups/bookings from other devices show up without a manual reload
    if(state.isAdmin && state.page === 'admin') render();
  }, 60000);
})();
