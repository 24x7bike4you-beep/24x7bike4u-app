<style>
  :root{
    --bg:#14191B;
    --surface:#1D2426;
    --surface-2:#252E30;
    --surface-light:#323C3F;
    --border:#323A3C;
    --border-strong:#454F52;
    --yellow:#F5C21B;
    --yellow-light:#FFDA5C;
    --yellow-shadow:#A9790A;
    --teal:#31B6A4;
    --teal-light:#4FD6C2;
    --teal-shadow:#0E5850;
    --teal-dim:#134A42;
    --whatsapp:#25D366;
    --whatsapp-light:#3BE87C;
    --whatsapp-shadow:#0E7A38;
    --red:#E2564E;
    --red-shadow:#7A251F;
    --text:#F3F2EC;
    --text-dim:#9BA1A0;
    --text-faint:#666D6C;
    --radius:14px;
  }
  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  .wrap.page{animation:fadeInUp .32s cubic-bezier(.2,.8,.3,1) both;}
  .vcard,.avcard,.ccard,.card,.ticket,.add-card,.profile-card,.booking-card,.vehicle-summary-card{animation:popIn .28s cubic-bezier(.2,.8,.3,1) both;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(ellipse 900px 500px at 50% -10%,#26302F 0%,var(--bg) 55%) fixed,var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,h3,.display{font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:-0.01em;margin:0;}
  .wrap{max-width:640px;margin:0 auto;padding:0 20px;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Header ---------- */
  header{border-bottom:1px solid var(--border);padding:20px 0;position:sticky;top:0;background:rgba(20,25,27,0.94);backdrop-filter:blur(8px);z-index:50;}
  .header-inner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:nowrap;max-width:640px;margin:0 auto;padding:0 20px;}
  .header-inner > div:last-child{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  @media (max-width:480px){
    header{padding:16px 0 14px;}
    .header-inner{padding:0 14px;gap:8px;flex-wrap:wrap;} /* logo gets its own full-width row so it never gets squeezed off */
    .brand{flex:0 0 100%;}
    .header-inner > div:last-child{flex:0 0 100%;justify-content:flex-end;margin-top:10px;gap:10px !important;} /* Call/WhatsApp/Login shifted onto their own row below the logo */
    .brand-mark{width:34px;height:34px;}
    .brand-name{font-size:16px;}
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;overflow:hidden;}
  .brand-mark{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border-strong);}
  .brand-name{font-family:'Archivo';font-weight:900;font-size:17px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-tag{font-size:10.5px;color:var(--yellow);letter-spacing:.04em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .step-track{display:flex;gap:6px;}
  .step-dot{width:22px;height:3px;border-radius:2px;background:var(--border-strong);}
  .step-dot.done{background:var(--yellow);}
  .step-dot.now{background:var(--teal);}

  .page{padding:28px 0 60px;}
  .back-btn{display:flex;align-items:center;gap:6px;color:var(--text-dim);background:none;border:none;font-size:13.5px;font-weight:500;padding:0 0 18px;}
  .back-btn:hover{color:var(--text);}

  /* ---------- Home / calculator form ---------- */
  .hero-eyebrow{color:var(--yellow);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 0 rgba(245,194,27,.6);animation:pulse 2s infinite;}

  .page > p.lead{color:var(--text-dim);font-size:14.5px;margin:0 0 26px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:7px;font-weight:500;}
  .field select, .field input{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);border-radius:8px;padding:11px 12px;font-size:14.5px;font-family:inherit;}
  .field select:focus, .field input:focus{outline:none;border-color:var(--yellow);}
  .pw-field{position:relative;}
  .pw-field input{padding-right:42px;}
  .pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:16px;cursor:pointer;color:var(--text-dim);padding:6px;line-height:1;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .type-toggle{display:flex;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:4px;gap:4px;}
  .type-toggle button{flex:1;background:transparent;border:none;color:var(--text-dim);padding:9px;border-radius:6px;font-size:14px;font-weight:600;transition:transform .12s ease,box-shadow .12s ease,background .12s ease;}
  .type-toggle button.active{background:linear-gradient(180deg,var(--yellow-light) 0%,var(--yellow) 100%);color:#161616;box-shadow:0 2px 0 var(--yellow-shadow),0 4px 8px rgba(0,0,0,.3);}
  .type-toggle button.active:active{transform:translateY(1px);box-shadow:0 1px 0 var(--yellow-shadow),0 1px 4px rgba(0,0,0,.25);}

  .km-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .km-chip{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text-dim);padding:12px 6px;border-radius:9px;text-align:center;}
  .km-chip .n{display:block;font-family:'Archivo';font-weight:900;font-size:17px;color:var(--text);}
  .km-chip .u{display:block;font-size:10.5px;margin-top:2px;}
  .km-chip.active{border-color:var(--teal);background:var(--teal-dim);}
  .km-chip.active .n{color:#8FE4D5;}

  .btn-primary{width:100%;background:linear-gradient(180deg,var(--yellow-light) 0%,var(--yellow) 100%);color:#161616;border:none;border-bottom:3px solid var(--yellow-shadow);border-radius:10px;padding:14px;font-weight:700;font-size:15px;margin-top:22px;box-shadow:0 4px 0 var(--yellow-shadow),0 8px 18px rgba(0,0,0,.35);transition:transform .12s ease,box-shadow .12s ease;}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--yellow-shadow),0 12px 22px rgba(0,0,0,.4);}
  .btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--yellow-shadow),0 2px 8px rgba(0,0,0,.3);}
  .btn-primary:disabled{transform:none;}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-primary:disabled{background:var(--surface-2);color:var(--text-faint);}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;}

  /* ---------- Vehicle list ---------- */
  .summary-strip{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:12.5px;color:var(--text-dim);}
  .summary-strip strong{color:var(--text);}
  .summary-strip button{background:none;border:none;color:var(--yellow);font-size:12.5px;font-weight:600;}

  .vlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;margin-bottom:0;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
  .vcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.4);border-color:var(--border-strong);}
  .vcard-photo-wrap{width:100%;aspect-ratio:4/3;background:var(--surface-2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .vcard-photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .vcard-photo-wrap svg{width:44%;height:44%;}
  .vcard-body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1;}
  .vcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;}
  .vcard-name{font-size:17px;font-weight:700;}
  .vcard-type{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .vcard-fare{text-align:right;flex-shrink:0;}
  .vcard-fare .amt{font-family:'Archivo';font-weight:900;font-size:21px;color:var(--yellow);}
  .vcard-fare .lbl{font-size:11px;color:var(--text-dim);}
  .vcard-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:12px 0;margin-bottom:14px;}
  .stat{text-align:left;}
  .stat .v{font-size:14px;font-weight:700;}
  .stat .k{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .vcard-select{width:100%;background:linear-gradient(180deg,var(--surface-light) 0%,var(--surface-2) 100%);border:1px solid var(--border-strong);color:var(--text);padding:11px;border-radius:8px;font-weight:600;font-size:14px;margin-top:auto;box-shadow:0 3px 0 rgba(0,0,0,.4),0 5px 10px rgba(0,0,0,.22);transition:transform .12s ease,box-shadow .12s ease,background .12s ease,color .12s ease,border-color .12s ease;}
  .vcard-select:hover{background:linear-gradient(180deg,var(--yellow-light) 0%,var(--yellow) 100%);border-color:var(--yellow);color:#161616;transform:translateY(-1px);box-shadow:0 4px 0 var(--yellow-shadow),0 8px 14px rgba(0,0,0,.3);}
  .vcard-select:active{transform:translateY(2px);box-shadow:0 1px 0 var(--yellow-shadow),0 2px 5px rgba(0,0,0,.25);}
  @media (max-width:520px){ .vlist-grid{grid-template-columns:1fr;} }
  .empty{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .empty h3{color:var(--text);font-size:17px;margin-bottom:8px;}

  /* ---------- Review page ---------- */
  .ticket{border:1px dashed var(--border-strong);border-radius:12px;padding:18px 20px;background:var(--surface);margin-bottom:16px;}
  .ticket-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--border-strong);}
  .ticket-head h3{font-size:18px;}
  .ticket-head .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .ticket-row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;color:var(--text-dim);}
  .ticket-row strong{color:var(--text);font-weight:600;}
  .ticket-divider{border-top:1px dashed var(--border-strong);margin:10px 0;}
  .ticket-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;}
  .ticket-total .amt{font-size:23px;font-weight:900;font-family:'Archivo';color:var(--yellow);}
  .note-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;font-size:12.5px;color:var(--text-dim);line-height:1.6;margin-bottom:20px;}

  .btn-whatsapp{width:100%;background:linear-gradient(180deg,var(--whatsapp-light) 0%,var(--whatsapp) 100%);color:#06210F;border:none;border-radius:10px;padding:15px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 4px 0 var(--whatsapp-shadow),0 8px 18px rgba(0,0,0,.35);transition:transform .12s ease,box-shadow .12s ease;}
  .btn-whatsapp:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--whatsapp-shadow),0 12px 22px rgba(0,0,0,.4);}
  .btn-whatsapp:active{transform:translateY(2px);box-shadow:0 1px 0 var(--whatsapp-shadow),0 2px 8px rgba(0,0,0,.3);}
  .btn-whatsapp:hover{filter:brightness(1.06);}

  footer{border-top:1px solid var(--border);padding:22px 0;color:var(--text-faint);font-size:12px;text-align:center;}
  footer .admin-link{background:none;border:none;color:var(--text-faint);font-size:12px;text-decoration:underline;cursor:pointer;margin-left:8px;}
  footer .admin-link:hover{color:var(--text-dim);}

  /* ---------- Admin ---------- */
  .admin-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .admin-bar h1{font-size:21px;}
  .admin-bar .sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .btn-ghost{background:linear-gradient(180deg,var(--surface-light) 0%,var(--surface-2) 100%);border:1px solid var(--border-strong);color:var(--text-dim);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.4),0 5px 10px rgba(0,0,0,.22);transition:transform .12s ease,box-shadow .12s ease;}
  .btn-ghost:hover{transform:translateY(-1px);box-shadow:0 4px 0 rgba(0,0,0,.4),0 8px 14px rgba(0,0,0,.28);}
  .btn-ghost:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4),0 2px 5px rgba(0,0,0,.2);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-dim);}

  .avcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .avcard.is-hidden{opacity:.55;}
  .avcard-top{display:flex;gap:14px;margin-bottom:14px;}

  .photo-slot .ph-empty{font-size:10px;color:var(--text-faint);text-align:center;padding:4px;}

  .badge-hidden{background:#3A2E12;color:var(--yellow);}

  @keyframes pulse-badge{0%,100%{opacity:1;}50%{opacity:.55;}}

  .login-card{max-width:340px;margin:60px auto 0;}
  .login-card .brand-mark{margin:0 auto 14px;}
  .login-card h1{font-size:20px;text-align:center;margin-bottom:4px;}
  .login-card p{color:var(--text-dim);font-size:13px;text-align:center;margin:0 0 22px;}

  .add-card{background:var(--surface);border:1px solid var(--teal);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .add-card h3{font-size:15px;margin-bottom:14px;}
  .add-card .field-row{grid-template-columns:1fr 1fr 1fr;}
  .add-card .field label{font-size:11px;}
  .add-card .field input, .add-card .field select{padding:9px 10px;font-size:13.5px;}
  .add-card .type-toggle{max-width:220px;}
  .add-actions{display:flex;gap:10px;margin-top:16px;}
  .add-actions .btn-primary{margin-top:0;flex:1;}
  .add-actions .btn-ghost{flex:0 0 auto;}

  /* ---------- Customer auth / signup ---------- */
  .auth-card{max-width:440px;margin:40px auto 0;}
  .auth-card .brand-mark{margin:0 auto 14px;}
  .auth-card h1{font-size:20px;text-align:center;margin-bottom:4px;}
  .auth-card p.sub-lead{color:var(--text-dim);font-size:13px;text-align:center;margin:0 0 22px;}
  .auth-switch{text-align:center;font-size:12.5px;color:var(--text-dim);margin-top:16px;}
  .auth-switch button{background:none;border:none;color:var(--yellow);font-weight:600;font-size:12.5px;text-decoration:underline;padding:0;}
  .form-section{margin-bottom:22px;}
  .form-section:last-child{margin-bottom:0;}
  .form-section-title{font-size:12.5px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);border-radius:8px;padding:11px 12px;font-size:14.5px;font-family:inherit;resize:vertical;min-height:64px;}
  .field textarea:focus{outline:none;border-color:var(--yellow);}
  .field-hint{font-size:11px;color:var(--text-faint);margin-top:6px;}

  .doc-upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .doc-upload{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:10px;padding:12px;text-align:center;}
  .doc-upload.has-file{border-style:solid;border-color:var(--teal);}
  .doc-upload-preview{width:100%;height:76px;border-radius:8px;background:var(--surface);border:1px solid var(--border-strong);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
  .doc-upload-preview img{width:100%;height:100%;object-fit:cover;}
  .doc-upload-preview .ph-empty{font-size:10px;color:var(--text-faint);}
  .doc-upload label{display:block;font-size:11.5px;font-weight:600;color:var(--text);margin-bottom:2px;}
  .doc-upload .doc-status{display:block;font-size:10.5px;color:var(--text-dim);margin-bottom:8px;}
  .doc-upload.has-file .doc-status{color:#8FE4D5;}
  .doc-upload-btn{display:inline-block;background:transparent;border:1px solid var(--border-strong);color:var(--text-dim);padding:7px 12px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .doc-upload-btn:hover{color:var(--text);}
  .doc-upload-btn input{display:none;}

  .gmail-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:12px;border-radius:10px;font-weight:600;font-size:14px;margin-bottom:18px;}
  .gmail-btn:hover{border-color:var(--text-dim);}
  .gmail-divider{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:11px;margin-bottom:18px;}
  .gmail-divider::before,.gmail-divider::after{content:'';flex:1;height:1px;background:var(--border);}

  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:99px;}
  .status-pill.pending{background:#3A2E12;color:var(--yellow);}
  .status-pill.verified{background:var(--teal-dim);color:#8FE4D5;}
  .status-pill.unverified{background:#3A1717;color:#F3A19C;}

  .ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .ccard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;}
  .ccard-name{font-size:15.5px;font-weight:700;}
  .ccard-meta{font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.6;}
  .ccard-docs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0;}
  .ccard-docs .doc-thumb{width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border-strong);}
  .ccard-docs .doc-thumb img{width:100%;height:100%;object-fit:cover;}
  .ccard-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .profile-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;}
  .profile-card:active{background:var(--surface-2);}
  .profile-avatar{width:48px;height:48px;border-radius:50%;flex-shrink:0;overflow:hidden;background:var(--surface-2);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--text-dim);}
  .profile-avatar img{width:100%;height:100%;object-fit:cover;}
  .profile-info{flex:1;min-width:0;}
  .profile-name{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .profile-mobile{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .profile-actions{display:flex;gap:8px;flex-shrink:0;}
  .profile-actions .icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;flex-shrink:0;box-shadow:0 3px 0 rgba(0,0,0,.4),0 5px 8px rgba(0,0,0,.25);transition:transform .12s ease,box-shadow .12s ease;}
  .profile-actions .icon-btn:hover{transform:translateY(-1px) scale(1.05);}
  .profile-actions .icon-btn:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.2);}
  .profile-actions .icon-btn.call{background:linear-gradient(180deg,var(--surface-light) 0%,var(--surface-2) 100%);border:1px solid var(--border-strong);}
  .profile-actions .icon-btn.wa{background:linear-gradient(180deg,var(--whatsapp-light) 0%,var(--whatsapp) 100%);box-shadow:0 3px 0 var(--whatsapp-shadow),0 5px 8px rgba(0,0,0,.25);}
  .profile-chevron{color:var(--text-faint);font-size:16px;flex-shrink:0;}
  .vehicle-summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;}
  .vehicle-summary-card:active{background:var(--surface-2);}
  .vehicle-summary-thumb{width:56px;height:56px;border-radius:10px;flex-shrink:0;overflow:hidden;background:var(--surface-2);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:10.5px;text-align:center;}
  .vehicle-summary-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .vehicle-summary-info{flex:1;min-width:0;}
  .vehicle-summary-name{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vehicle-summary-badges{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .ccard-collapse{background:transparent;border:none;color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:4px;}
  .booking-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .booking-card:active{background:var(--surface-2);}
  .booking-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .booking-card-title{font-size:14.5px;font-weight:700;}
  .booking-card-id{color:var(--text-dim);font-weight:500;font-size:12px;}
  .booking-card-sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .booking-card-row{font-size:12.5px;color:var(--text-dim);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 16px;}
  .booking-card-row b{color:var(--text);font-weight:600;}
  .booking-card-amount{font-size:15px;font-weight:800;color:var(--teal);white-space:nowrap;flex-shrink:0;}
  .booking-card-chevron{color:var(--text-faint);font-size:16px;flex-shrink:0;}
  .doceditor-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
  .doceditor-modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:92vh;overflow-y:auto;}
  .doceditor-modal h3{font-size:15px;margin-bottom:4px;}
  .doceditor-canvas-wrap{background:repeating-conic-gradient(#2A2F31 0% 25%, #1D2122 0% 50%) 0 0/16px 16px;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;margin:10px 0;display:flex;align-items:center;justify-content:center;touch-action:none;}
  .doceditor-canvas-wrap canvas{max-width:100%;display:block;touch-action:none;}
  .doceditor-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .doceditor-row button{flex:1;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:9px 8px;border-radius:8px;font-size:12px;font-weight:600;min-width:70px;}
  .doceditor-row button:disabled{opacity:.4;}
  .doceditor-slider-row{margin-top:10px;}
  .doceditor-slider-row label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;}
  .doceditor-slider-row input[type="range"]{width:100%;}
  .doceditor-hint{font-size:11px;color:var(--text-faint);margin-top:8px;line-height:1.5;}
  .account-summary-row{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--border);color:var(--text-dim);}
  .account-summary-row:last-child{border-bottom:none;}
  .account-summary-row strong{color:var(--text);font-weight:600;}
  .tab-switch{display:flex;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:4px;gap:4px;margin-bottom:20px;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tab-switch::-webkit-scrollbar{display:none;}
  .tab-switch button{flex:0 0 auto;white-space:nowrap;background:transparent;border:none;color:var(--text-dim);padding:9px 16px;border-radius:6px;font-size:13.5px;font-weight:600;transition:transform .12s ease,box-shadow .12s ease;}
  .tab-switch button.active{background:linear-gradient(180deg,var(--yellow-light) 0%,var(--yellow) 100%);color:#161616;box-shadow:0 2px 0 var(--yellow-shadow),0 4px 8px rgba(0,0,0,.3);}
</style>

let TERMS_TEXT = `1. PAYMENT: Rentals are payable via Cash, UPI, or Card, collected at pickup and/or drop-off. 24x7 Bike4u does not currently accept online/gateway payments through this app.

2. DEPOSIT: A refundable security deposit (as shown on your booking) is collected at pickup and refunded at drop-off, subject to clause 5 (Damages) below.

3. DOCUMENTS: A valid original driving licence and Aadhar card must be produced at pickup. Details must match the KYC profile submitted at signup.

4. FUEL: Vehicle is handed over with a certain fuel level and must be returned with the same level, or a refuelling charge will be deducted from the deposit.

5. DAMAGES & LOSS: The customer is responsible for any damage, theft, or loss of the vehicle during the rental period. Repair/replacement cost will be deducted from the deposit; any shortfall must be paid by the customer.

let sb = null;
let sbClientPromise = null;
function waitForSupabaseLib(timeoutMs){
  return new Promise((resolve) => {
    if(window.supabase && window.supabase.createClient){ resolve(true); return; }
    const start = Date.now();
    const iv = setInterval(() => {
      if(window.supabase && window.supabase.createClient){
        clearInterval(iv);
        resolve(true);
      } else if(Date.now() - start > (timeoutMs || 6000)){
        clearInterval(iv);
        resolve(false);
      }
    }, 100);
  });
}
async function getSupabase(){
  if(sb) return sb;
  if(sbClientPromise) return sbClientPromise;
  sbClientPromise = (async () => {
    const ready = await waitForSupabaseLib(6000);
    if(!ready){
      console.warn('Bike4u: Supabase library never became available -- check your network/ad-blocker; sync unavailable for this call.');
      return null;
    }
    try{
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('Bike4u: Supabase client ready.');
      return sb;
    }catch(e){ console.warn('Bike4u: Supabase client init failed:', e); return null; }
  })();
  return sbClientPromise;
}

async function sbGet(key){
  const client = await getSupabase();
  if(!client) return null;
  try{
    const { data, error } = await client.from('app_data').select('value').eq('key', key).maybeSingle();
    if(error){ console.warn('Bike4u: Supabase load error for', key, '--', error.message || error); return null; }
    console.log('Bike4u: loaded', key, 'from Supabase:', data ? 'found' : 'not found yet');
    return data ? data.value : null;
  }catch(e){ console.warn('Bike4u: Supabase load failed for', key, e); return null; }
}

async function sbSet(key, value){
  const client = await getSupabase();
  if(!client) return false;
  try{
    const { error } = await client.from('app_data').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error){ console.warn('Bike4u: Supabase save error for', key, '--', error.message || error); return false; }
    console.log('Bike4u: saved', key, 'to Supabase.');
    return true;
  }catch(e){ console.warn('Bike4u: Supabase save failed for', key, e); return false; }
}

// Pulls the latest vehicles/customers/bookings from Supabase (if reachable),
// overwrites the in-memory arrays + localStorage cache, and re-renders.
// If Supabase has no data yet (brand-new project), it pushes this
// browser's current data up so other devices pick it up from then on.
async function syncFromSupabase(){
  const [remoteVehicles, remoteCustomers, remoteBookings, remoteNotifications, remotePaymentSettings, remoteTerms] = await Promise.all([
    sbGet('vehicles'), sbGet('customers'), sbGet('bookings'), sbGet('notifications'), sbGet('paymentSettings'), sbGet('terms')
  ]);

  if(Array.isArray(remoteVehicles) && remoteVehicles.length){
    VEHICLES = remoteVehicles;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(VEHICLES)); }catch(e){}
  } else {
    sbSet('vehicles', VEHICLES);
  }

  // Guarded the same way as vehicles above: an empty array from Supabase here almost
  // always means a transient read glitch, not that every customer vanished, so we never
  // let it wipe out customers this browser already has. Only a genuinely non-empty
  // remote list -- or this browser having nothing to lose -- is accepted.
  if(Array.isArray(remoteCustomers) && (remoteCustomers.length || CUSTOMERS.length === 0)){
    CUSTOMERS = remoteCustomers;
    try{ localStorage.setItem(CUSTOMERS_STORAGE_KEY, JSON.stringify(CUSTOMERS)); }catch(e){}
    lastSyncOk.customers = true;
  } else {
    sbSet('customers', CUSTOMERS).then(ok => { lastSyncOk.customers = ok; if(state.isAdmin && state.page==='admin') render(); });
  }

  if(Array.isArray(remoteBookings) && (remoteBookings.length || BOOKINGS.length === 0)){
    BOOKINGS = remoteBookings;
    try{ localStorage.setItem(BOOKINGS_STORAGE_KEY, JSON.stringify(BOOKINGS)); }catch(e){}
  } else {
    sbSet('bookings', BOOKINGS);
  }

  if(Array.isArray(remoteNotifications) && (remoteNotifications.length || NOTIFICATIONS.length === 0)){
    NOTIFICATIONS = remoteNotifications;
    try{ localStorage.setItem(NOTIFICATIONS_STORAGE_KEY, JSON.stringify(NOTIFICATIONS)); }catch(e){}
  } else {
    sbSet('notifications', NOTIFICATIONS);
  }

  const remoteCoupons = await sbGet('coupons');
  if(Array.isArray(remoteCoupons) && (remoteCoupons.length || COUPONS.length === 0)){
    COUPONS = remoteCoupons;
    try{ localStorage.setItem(COUPONS_STORAGE_KEY, JSON.stringify(COUPONS)); }catch(e){}
  } else {
    sbSet('coupons', COUPONS);
  }

  if(remotePaymentSettings && typeof remotePaymentSettings === 'object'){
    PAYMENT_SETTINGS = Object.assign({}, DEFAULT_PAYMENT_SETTINGS, remotePaymentSettings);
    try{ localStorage.setItem(PAYMENT_SETTINGS_KEY, JSON.stringify(PAYMENT_SETTINGS)); }catch(e){}
  } else {
    sbSet('paymentSettings', PAYMENT_SETTINGS);
  }

  if(remoteTerms && typeof remoteTerms === 'object' && remoteTerms.text){
    TERMS_TEXT = remoteTerms.text;
    TERMS_VERSION = remoteTerms.version || TERMS_VERSION;
    try{ localStorage.setItem(TERMS_STORAGE_KEY, JSON.stringify(remoteTerms)); }catch(e){}
  } else {
    sbSet('terms', { text: TERMS_TEXT, version: TERMS_VERSION });
  }

  checkOverdueBookings();
  render();
}

// Validates a coupon code against the current rent amount and returns
// { ok: true, coupon, discount } or { ok: false, message }.
function validateCoupon(codeRaw, rentAmount){
  const code = (codeRaw || '').trim().toUpperCase();
  if(!code) return { ok: false, message: 'Enter a coupon code.' };
  const coupon = COUPONS.find(c => c.code.toUpperCase() === code);
  if(!coupon) return { ok: false, message: 'Invalid coupon code.' };
  if(!coupon.active) return { ok: false, message: 'This coupon is no longer active.' };
  if(coupon.expiresAt){
    const exp = new Date(coupon.expiresAt + 'T23:59:59');
    if(new Date() > exp) return { ok: false, message: 'This coupon has expired.' };
  }
  const discount = coupon.type === 'percent'
    ? Math.round(rentAmount * coupon.value / 100)
    : Math.min(coupon.value, rentAmount);
  return { ok: true, coupon, discount };
}

// Total duration in (fractional) hours between pickup and drop-off. 0 if invalid/incomplete.
function calcTotalHours(){
  if(!state.pickupDate || !state.pickupTime || !state.dropDate || !state.dropTime) return 0;
  const start = new Date(state.pickupDate + 'T' + state.pickupTime);
  const end = new Date(state.dropDate + 'T' + state.dropTime);
  const ms = end - start;
  if(ms <= 0) return 0;
  return ms / (3600 * 1000);
}

// Same calculation as calcTotalHours() but for arbitrary date/time values rather than the
// live search form -- used when admin edits an already-placed booking's dates.
function hoursBetweenRaw(pDate, pTime, dDate, dTime){
  if(!pDate || !pTime || !dDate || !dTime) return 0;
  const start = new Date(pDate + 'T' + pTime);
  const end = new Date(dDate + 'T' + dTime);
  const ms = end - start;
  return ms > 0 ? ms / (3600 * 1000) : 0;
}

// Real-time fleet status: is this vehicle out on rent right now, and if so when is it due
// (or overdue) back? Used by the admin Fleet tab and the overdue-vehicle popup checker.
// Since the app has no explicit "returned" event, a vehicle is considered still out, from
// its pickup time onward, until either its drop-off time or -- if that has passed -- until
// a newer booking for the same vehicle starts (which implies it must have come back).
function vehicleActiveBooking(vehicleId){
  const now = new Date();
  let latestStarted = null;
  for(const bk of BOOKINGS){
    if(bk.vehicleId !== vehicleId) continue;
    if(bk.returnedAt) continue; // admin has manually cleared this booking off the vehicle
    const start = new Date(bk.pickupDate + 'T' + bk.pickupTime);
    if(start > now) continue; // hasn't been picked up yet
    if(!latestStarted || start > new Date(latestStarted.pickupDate + 'T' + latestStarted.pickupTime)){
      latestStarted = bk;
    }
  }
  return latestStarted;
}

function vehicleRentalStatus(vehicleId){
  const bk = vehicleActiveBooking(vehicleId);
  if(!bk) return { rented: false };
  const now = new Date();
  const end = new Date(bk.dropDate + 'T' + bk.dropTime);
  return {
    rented: true,
    overdue: now > end,
    booking: bk,
    untilDate: bk.dropDate,
    untilTime: bk.dropTime,
  };
}

// Breaks total duration into Weekly + Daily + 12-Hour blocks per the business rules:
// - <=12h total, with nothing else: the "pure" 12-hour case -> 80km plan becomes available.
// - >12h and <24h total: billed as one full Daily plan (no 80km).
// - Any leftover after full weeks/days that is <=12h: add one 12-Hour block on top.
// - Any leftover >12h (and <24h) rounds up to one more full Daily block.
function getPlan(){
  const totalHours = calcTotalHours();
  if(totalHours <= 0){
    return { totalHours: 0, weeks: 0, days: 0, remainderHours: 0, isPureShort: false, kmOptions: [120, 150, 200] };
  }
  const HOURS_WEEK = 24 * 7;
  const weeks = Math.floor(totalHours / HOURS_WEEK);
  let rem = totalHours - weeks * HOURS_WEEK;
  let days = Math.floor(rem / 24);
  let remainderHours = rem - days * 24;
  if(remainderHours > 12){
    days += 1;
    remainderHours = 0;
  }
  const isPureShort = (weeks === 0 && days === 0 && remainderHours > 0);
  // Exact multiple of a week (e.g. 7, 14, 21 days) with no leftover day or hour block --
  // the weekly rate is flat and doesn't depend on a km choice, so the km selector is skipped.
  const isPureWeekly = (weeks > 0 && days === 0 && remainderHours === 0);
  const kmOptions = isPureShort ? [80, 120, 150, 200] : [120, 150, 200];
  return { totalHours, weeks, days, remainderHours, isPureShort, isPureWeekly, kmOptions };
}

// Makes sure the selected km plan is actually valid for the current duration
// (e.g. drops the 80km plan the moment the booking grows past 12 hours).
function syncKmPackage(plan){
  if(!plan.kmOptions.includes(state.kmPackage)){
    state.kmPackage = plan.kmOptions[0];
  }
}

// The vehicle's one true 12-hour rate (from the 80km/12-hour column) -- there is no
// separate 12-hour rate for 120/150/200 in the pricing sheet, so this is used flat
// whenever a leftover block of 12 hours or less needs to be added.
function halfDayRate(v){
  return v.half80;
}

// Bills full 7-day blocks at the flat weekly rate (700km included per week), full 24-hour
// blocks at the daily rate for the chosen km plan, and any <=12h leftover as one 12-hour block.
function billingBreakdown(v){
  const plan = getPlan();
  const km = state.kmPackage;
  if(plan.totalHours <= 0) return { ...plan, total: 0, includedKm: 0 };

  let total, includedKm;
  if(plan.isPureShort){
    // 80km is a genuine standalone 12-hour plan with its own rate. 120/150/200 are
    // daily rate plans -- picking one for a <=12h booking still charges that vehicle's
    // normal flat daily rate (not a computed half-price), since there's no partial-day rate for them.
    total = (km === 80) ? v.half80 : v.rate[km];
    includedKm = km;
  } else {
    // A leftover of 12 hours or less after full day(s)/week(s) always adds the vehicle's
    // one 12-hour/80km rate on top -- that's the only 12-hour rate that exists, regardless
    // of which km plan was chosen for the full-day portion.
    total = plan.weeks * v.weekly + plan.days * v.rate[km] + (plan.remainderHours > 0 ? halfDayRate(v) : 0);
    includedKm = plan.weeks * 700 + plan.days * km + (plan.remainderHours > 0 ? 80 : 0);
  }
  return { ...plan, total, includedKm };
}

// Same plan/billing math as getPlan()/billingBreakdown(), but parameterized on explicit
// dates/vehicle instead of the live search state -- used by the admin's manual booking
// form so it can preview pricing without touching the customer-facing search state.
function planForDates(pDate, pTime, dDate, dTime){
  const totalHours = hoursBetweenRaw(pDate, pTime, dDate, dTime);
  if(totalHours <= 0){
    return { totalHours: 0, weeks: 0, days: 0, remainderHours: 0, isPureShort: false, isPureWeekly: false, kmOptions: [120, 150, 200] };
  }
  const HOURS_WEEK = 24 * 7;
  const weeks = Math.floor(totalHours / HOURS_WEEK);
  let rem = totalHours - weeks * HOURS_WEEK;
  let days = Math.floor(rem / 24);
  let remainderHours = rem - days * 24;
  if(remainderHours > 12){
    days += 1;
    remainderHours = 0;
  }
  const isPureShort = (weeks === 0 && days === 0 && remainderHours > 0);
  const isPureWeekly = (weeks > 0 && days === 0 && remainderHours === 0);
  const kmOptions = isPureShort ? [80, 120, 150, 200] : [120, 150, 200];
  return { totalHours, weeks, days, remainderHours, isPureShort, isPureWeekly, kmOptions };
}

function billingFor(v, pDate, pTime, dDate, dTime, km){
  const plan = planForDates(pDate, pTime, dDate, dTime);
  if(plan.totalHours <= 0) return { ...plan, total: 0, includedKm: 0 };
  let total, includedKm;
  if(plan.isPureShort){
    total = (km === 80) ? v.half80 : v.rate[km];
    includedKm = km;
  } else {
    total = plan.weeks * v.weekly + plan.days * v.rate[km] + (plan.remainderHours > 0 ? halfDayRate(v) : 0);
    includedKm = plan.weeks * 700 + plan.days * km + (plan.remainderHours > 0 ? 80 : 0);
  }
  return { ...plan, total, includedKm };
}

// Human-readable label for the customer's actual selected duration, e.g. "8 Days 5 Hours".
// Shows plain elapsed time only -- never names internal billing blocks like "12-hour plan".
function durationLabel(totalHours){
  if(totalHours <= 0) return '';
  let days = Math.floor(totalHours / 24);
  let hours = Math.round(totalHours - days * 24);
  if(hours === 24){ days += 1; hours = 0; }
  const parts = [];
  if(days > 0) parts.push(`${days} Day${days > 1 ? 's' : ''}`);
  if(hours > 0) parts.push(`${hours} Hour${hours > 1 ? 's' : ''}`);
  return parts.length ? parts.join(' ') : '0 Hours';
}

function fmtDate(d){
  if(!d) return '';
  return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':');
  const hr = parseInt(h,10);
  const ampm = hr>=12?'PM':'AM';
  const h12 = ((hr+11)%12)+1;
  return `${h12}:${m} ${ampm}`;
}
function money(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }

// PDF downloads depend on the externally-loaded jsPDF library, which can still be mid-flight
// (slow network) or may have failed on every CDN mirror. Instead of failing instantly the
// first time it's not yet ready, this polls for up to ~6 seconds before giving up, so a slow
// connection doesn't look like a broken "Download PDF" button.
function ensureJsPDFThen(callback, attempt){
  attempt = attempt || 0;
  if(window.jspdf && window.jspdf.jsPDF){
    callback();
    return;
  }
  if(attempt > 30){
    alert('The PDF library could not be loaded. This usually means your internet connection is offline or your network is blocking cdnjs.cloudflare.com, cdn.jsdelivr.net and unpkg.com. Please check your connection and try again.');
    return;
  }
  setTimeout(function(){ ensureJsPDFThen(callback, attempt + 1); }, 200);
}

// The 80km option in a <=12h booking is a true standalone flat rate (no "/day").
// Every other km option is always the vehicle's per-day rate, even when it's being
// applied flat because the booking itself is 12 hours or less.
function kmUnit(plan, km){
  return (plan.isPureShort && km === 80) ? '' : '/day';
}

// Today's date (device-local) as YYYY-MM-DD, used as the "min" for date pickers so
// customers can't select a pickup or drop-off date in the past.
function todayStr(){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
}

// Lets the customer reveal a password field to check what they typed. Toggles the input's
// type and swaps the eye icon; never changes the value itself.
function togglePasswordField(inputId, btn){
  const input = document.getElementById(inputId);
  if(!input) return;
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '👁' : '🙈';
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
}

function setDateTimeField(key, val){
  if((key === 'pickupDate' || key === 'dropDate') && val < todayStr()){
    val = todayStr();
  }
  state[key] = val;
  if(key === 'pickupDate' && state.dropDate < val){
    state.dropDate = val; // keep drop-off from falling before the newly chosen pickup date
  }
  renderHome();
}

// Best-effort public IP lookup for the booking record (shown on the agreement PDF as part
// of the digital acceptance trail). Times out quickly and falls back gracefully -- an
// unknown IP should never block a booking from completing.
function getClientIp(){
  return new Promise((resolve) => {
    const timeout = setTimeout(() => resolve('Not available'), 4000);
    fetch('https://api.ipify.org?format=json')
      .then(r => r.json())
      .then(data => { clearTimeout(timeout); resolve(data && data.ip ? data.ip : 'Not available'); })
      .catch(() => { clearTimeout(timeout); resolve('Not available'); });
  });
}

// Best-effort geo-tag (lat/long, with accuracy in metres) for the booking record, captured
// at the moment of agreement -- shown on the agreement PDF alongside the IP address as
// part of the digital acceptance trail. Requires the browser's location permission; if
// it's denied, unsupported, or slow to respond, this resolves to a clear fallback string
// rather than blocking or failing the booking.
function getClientGeo(){
  return new Promise((resolve) => {
    if(!('geolocation' in navigator)){ resolve('Not available (unsupported)'); return; }
    const timeout = setTimeout(() => resolve('Not available (timed out)'), 8000);
    navigator.geolocation.getCurrentPosition(
      pos => {
        clearTimeout(timeout);
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        const acc = Math.round(pos.coords.accuracy);
        resolve(`${lat}, ${lng} (±${acc}m)`);
      },
      () => { clearTimeout(timeout); resolve('Not available (permission denied)'); },
      { enableHighAccuracy: true, timeout: 7000, maximumAge: 60000 }
    );
  });
}

// Creates the stored, downloadable rental agreement for this booking (tied to the
// customer's profile) and then hands off to WhatsApp for final confirmation with staff.
function confirmBookingAndSend(){
  if(!state.currentCustomer || !state.agreedTerms) return;
  const v = state.selectedVehicle;
  const c = state.currentCustomer;
  const b = billingBreakdown(v);

  const maxNum = BOOKINGS.reduce((m,bk) => Math.max(m, parseInt((bk.id||'BK0').replace('BK',''),10) || 0), 0);
  const couponDiscount = state.appliedCoupon ? state.appliedCoupon.discount : 0;
  const booking = {
    id: 'BK' + (maxNum + 1),
    customerId: c.id,
    customerName: c.name,
    customerEmail: c.email,
    customerMobile: c.mobile,
    vehicleId: v.id,
    vehicleName: v.name,
    vehicleColour: v.colour,
    vehicleRc: v.rc,
    pickupDate: state.pickupDate, pickupTime: state.pickupTime,
    dropDate: state.dropDate, dropTime: state.dropTime,
    durationLabel: durationLabel(b.totalHours),
    kmLabel: b.isPureWeekly ? `${b.includedKm} km included (700 km/week)` : `${state.kmPackage} km${kmUnit(b, state.kmPackage)} · ${b.includedKm} km included`,
    rentalTotal: b.total - couponDiscount,
    couponCode: state.appliedCoupon ? state.appliedCoupon.code : null,
    couponDiscount: couponDiscount,
    deposit: v.deposit,
    extraKmCharge: v.extraKm,
    paymentMethod: 'Cash / UPI / Card (collected at pickup/drop-off)',
    termsVersion: TERMS_VERSION,
    agreedAt: new Date().toISOString(),
    customerIp: 'Detecting…',
    customerGeo: 'Detecting…',
  };
  BOOKINGS.push(booking);
  saveBookings();
  notifyIfNewBooking(booking);

  bookOnWhatsapp(booking);
  sendInvoiceOnWhatsapp(booking.id, 'booking');

  // Fetch the IP and geo-location in the background (not awaited) so neither ever delays
  // the WhatsApp popup -- some browsers block window.open() if it's not immediately tied
  // to the click. The booking record (and any PDF generated from it) picks up the real
  // values once these resolve, a second or two later.
  getClientIp().then(ip => {
    booking.customerIp = ip;
    saveBookings();
  });
  getClientGeo().then(geo => {
    booking.customerGeo = geo;
    saveBookings();
  });

  state.agreedTerms = false;
  state.showTerms = false;
  state.appliedCoupon = null;
  state.couponInput = '';
  state.couponMessage = '';
  goTo('home');
}

function bookOnWhatsapp(booking){
  const msg = `Hi 24x7 Bike4u! I'd like to confirm my booking.

Agreement ID: ${booking.id}
Customer: ${booking.customerName} (${booking.customerEmail})
Vehicle: ${booking.vehicleName} (${booking.vehicleColour}, ${booking.vehicleRc})
Pickup: ${fmtDate(booking.pickupDate)}, ${fmtTime(booking.pickupTime)}
Drop-off: ${fmtDate(booking.dropDate)}, ${fmtTime(booking.dropTime)}
Duration: ${booking.durationLabel}
Kilometres: ${booking.kmLabel}
${booking.couponCode ? `Coupon applied: ${booking.couponCode} (-${money(booking.couponDiscount)})\n` : ''}Rental total: ${money(booking.rentalTotal)}
Deposit (refundable): ${money(booking.deposit)}
Extra km charge: ₹${booking.extraKmCharge}/km
Payment: ${booking.paymentMethod}

I have agreed to the Terms & Conditions for this booking. Please confirm availability.`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

// Auto-saves signup progress to this browser so a refresh, accidental tab close, or lost
// connection mid-signup doesn't make the customer start over -- especially painful given
// how much they type and how many documents they upload on this form.
const CUSTOMER_DRAFT_KEY = 'bike4u_customer_draft_v1';
function loadCustomerDraft(){
  try{
    const saved = localStorage.getItem(CUSTOMER_DRAFT_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(parsed && typeof parsed === 'object') return Object.assign(blankCustomerDraft(), parsed);
    }
  }catch(e){
    console.warn('Could not load saved signup draft:', e);
  }
  return blankCustomerDraft();
}
function saveCustomerDraft(){
  try{
    localStorage.setItem(CUSTOMER_DRAFT_KEY, JSON.stringify(customerDraft));

    console.warn('Could not auto-save signup progress (storage may be full):', e);

}

// Three-state verification: 'pending' (default, not yet reviewed), 'verified' (green tick),
// 'unverified' (admin has actively rejected/flagged the profile, shown in red).
// Falls back to the old boolean `verified` field for any profiles saved before this existed.
function verificationStatusOf(c){
  if(c.verificationStatus) return c.verificationStatus;
  return c.verified ? 'verified' : 'pending';
}
function statusPillHtml(c){
  const s = verificationStatusOf(c);
  if(s === 'verified') return `<span class="status-pill verified">✓ Verified</span>`;
  if(s === 'unverified') return `<span class="status-pill unverified">✕ Unverified</span>`;
  return `<span class="status-pill pending">Pending verification</span>`;
}

function submitCustomerSignup(){
  const d = customerDraft;
  const errEl = document.getElementById('signup-err');
  const showErr = msg => { errEl.textContent = msg; errEl.style.display = 'block'; };

  const email = d.email.trim().toLowerCase();
  if(!/^[^\s@]+@gmail\.com$/.test(email)){
    showErr('Please sign up with a valid Gmail address (must end with @gmail.com).');
    return;
  }
  if(CUSTOMERS.some(c => c.email === email)){
    showErr('An account with this Gmail address already exists -- please log in instead.');
    return;
  }
  if(!d.password || d.password.length < 6){
    showErr('Password must be at least 6 characters.');
    return;
  }
  if(!d.name.trim()){
    showErr('Please enter your full name.');
    return;
  }
  const mobile = d.mobile.trim();
  const emergency = d.emergency.trim();
  if(!/^\d{10}$/.test(mobile)){
    showErr('Please enter a valid 10-digit mobile number.');
    return;
  }
  if(!/^\d{10}$/.test(emergency)){
    showErr('Please enter a valid 10-digit emergency contact number.');
    return;
  }
  if(emergency === mobile){
    showErr('Emergency contact number must be different from your mobile number.');
    return;
  }
  if(!d.address.trim()){
    showErr('Please enter your local Indore address.');
    return;
  }
  for(const f of DOC_FIELDS){
    if(!d[f.key]){
      showErr(`Please upload: ${f.label}.`);
      return;

  const maxNum = CUSTOMERS.reduce((m,c) => Math.max(m, parseInt((c.id||'C0').replace('C',''),10) || 0), 0);

    createdAt: new Date().toISOString(),
    verificationStatus: 'pending',

  resetCustomerDraft();
  if(state.returnToReviewAfterAuth){
    state.returnToReviewAfterAuth = false;
    goTo('review');

    goTo('customer-account');

function requestAdminNotificationPermission(){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'default'){
    Notification.requestPermission();
  }
}

// Tracks ids we've already alerted on, so the same booking/signup never notifies twice
// (once from the tab that created it, once from the realtime echo of that same change).
const notifiedBookingIds = new Set();
const notifiedCustomerIds = new Set();

function notifyAdmin(title, body, onClickGoTo){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission !== 'granted') return;
  try{
    const n = new Notification(title, { body, icon: LOGO_BASE64 });
    if(onClickGoTo){
      n.onclick = function(){
        try{ window.focus(); }catch(e){}
        if(state.isAdmin){ goTo(onClickGoTo); }
        n.close();
      };
    }
  }catch(e){}
}

function notifyIfNewBooking(booking){
  if(!booking || !booking.id || notifiedBookingIds.has(booking.id)) return;
  notifiedBookingIds.add(booking.id);
  notifyAdmin('New booking', `${booking.customerName} booked ${booking.vehicleName}.`, 'admin');
}

function notifyIfNewCustomer(customer){
  if(!customer || !customer.id || notifiedCustomerIds.has(customer.id)) return;
  notifiedCustomerIds.add(customer.id);
  notifyAdmin('New customer signup', `${customer.name} just created a profile.`, 'admin');
}

// Popup alert when a vehicle isn't brought back on time. Fires once per booking (not
// repeatedly every minute) and only for the booking that is still the vehicle's active
// one -- i.e. it hasn't been superseded by a newer rental, which would imply it came back.
const notifiedOverdueIds = new Set();
function checkOverdueBookings(){
  if(!state.isAdmin) return;
  VEHICLES.forEach(v => {
    const rs = vehicleRentalStatus(v.id);
    if(rs.rented && rs.overdue && !notifiedOverdueIds.has(rs.booking.id)){
      notifiedOverdueIds.add(rs.booking.id);
      notifyAdmin(
        'Vehicle not returned on time',
        `${rs.booking.vehicleName} (Booking ${rs.booking.id}, ${rs.booking.customerName}) was due back ${fmtDate(rs.untilDate)} at ${fmtTime(rs.untilTime)}.`,
        'admin'
      );
    }
  });
}

// Cross-device alerts: as long as the admin has this app open (any tab, any device --
// phone or computer), Supabase Realtime pushes every bookings/customers change straight
// to this tab, so a booking or signup made on a *different* device still triggers a
// notification here. Requires realtime to be enabled for the 'app_data' table in the
// Supabase dashboard (Database -> Replication).
let adminRealtimeChannel = null;
async function subscribeAdminRealtime(){
  if(adminRealtimeChannel) return;
  const client = await getSupabase();
  if(!client) return;
  try{
    adminRealtimeChannel = client
      .channel('admin-notifications')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_data', filter: 'key=eq.bookings' }, (payload) => {
        const arr = payload && payload.new && payload.new.value;
        if(!Array.isArray(arr)) return;
        const existingIds = new Set(BOOKINGS.map(b => b.id));
        const freshOnes = arr.filter(b => !existingIds.has(b.id));
        if(freshOnes.length){
          BOOKINGS = arr;
          try{ localStorage.setItem(BOOKINGS_STORAGE_KEY, JSON.stringify(BOOKINGS)); }catch(e){}
          freshOnes.forEach(notifyIfNewBooking);
          if(state.isAdmin && state.page === 'admin') render();
        }
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_data', filter: 'key=eq.customers' }, (payload) => {
        const arr = payload && payload.new && payload.new.value;
        if(!Array.isArray(arr)) return;
        const existingIds = new Set(CUSTOMERS.map(c => c.id));
        const freshOnes = arr.filter(c => !existingIds.has(c.id));
        if(freshOnes.length){
          CUSTOMERS = arr;
          try{ localStorage.setItem(CUSTOMERS_STORAGE_KEY, JSON.stringify(CUSTOMERS)); }catch(e){}
          freshOnes.forEach(notifyIfNewCustomer);
          if(state.isAdmin && state.page === 'admin') render();
        }
      })
      .subscribe();
  }catch(e){ console.warn('Bike4u: could not subscribe to realtime admin notifications:', e); }
}

/* ============ CUSTOMER-SIDE: return reminders / extension notifications ============
   Mirrors the admin realtime-notification pattern above, but scoped to the logged-in
   customer: subscribes to changes on the shared 'notifications' record, and for any
   fresh entry addressed to this customer, shows a browser notification (if the
   customer's device has granted permission and this tab is open) plus surfaces it in
   their account page. */
const shownNotificationIds = new Set();

function requestCustomerNotificationPermission(){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'default'){
    Notification.requestPermission();
  }
}

function notifyCustomer(title, body){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission !== 'granted') return;
  try{
    const n = new Notification(title, { body, icon: LOGO_BASE64 });
    n.onclick = function(){
      try{ window.focus(); }catch(e){}
      if(state.currentCustomer){ goTo('customer-account'); }
      n.close();
    };
  }catch(e){}
}

function notifyIfNewForCustomer(notif){
  if(!notif || !notif.id || shownNotificationIds.has(notif.id)) return;
  if(!state.currentCustomer || notif.customerId !== state.currentCustomer.id) return;
  shownNotificationIds.add(notif.id);
  notifyCustomer(notif.title, notif.body);
}

function markNotificationRead(id){
  const n = NOTIFICATIONS.find(x => x.id === id);
  if(!n || n.read) return;
  n.read = true;
  saveNotifications();
  if(state.page === 'customer-account') renderCustomerAccount();
}

let customerRealtimeChannel = null;
async function subscribeCustomerRealtime(){
  if(customerRealtimeChannel) return;
  const client = await getSupabase();
  if(!client) return;
  try{
    customerRealtimeChannel = client
      .channel('customer-notifications')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_data', filter: 'key=eq.notifications' }, (payload) => {
        const arr = payload && payload.new && payload.new.value;
        if(!Array.isArray(arr)) return;
        const existingIds = new Set(NOTIFICATIONS.map(n => n.id));
        const freshOnes = arr.filter(n => !existingIds.has(n.id));
        NOTIFICATIONS = arr;
        try{ localStorage.setItem(NOTIFICATIONS_STORAGE_KEY, JSON.stringify(NOTIFICATIONS)); }catch(e){}
        freshOnes.forEach(notifyIfNewForCustomer);
        if(state.currentCustomer && state.page === 'customer-account') renderCustomerAccount();
      })
      .subscribe();
  }catch(e){ console.warn('Bike4u: could not subscribe to realtime customer notifications:', e); }
}

// Called any time a customer session becomes active (login, signup, session restore,
// password reset) so this device starts listening for return/extension notifications.
function onCustomerAuthenticated(){
  requestCustomerNotificationPermission();
  subscribeCustomerRealtime();
}

function saveNewCustomerManually(){
  const d = newCustomerDraft;
  const errEl = document.getElementById('new-customer-err');
  const showErr = msg => { errEl.textContent = msg; errEl.style.display = 'block'; };

  if(!d.name.trim()){ showErr("Please enter the customer's full name."); return; }
  const mobile = d.mobile.trim();
  if(!/^\d{10}$/.test(mobile)){ showErr('Please enter a valid 10-digit mobile number.'); return; }
  if(CUSTOMERS.some(c => c.mobile === mobile)){ showErr('A customer with this mobile number already exists.'); return; }
  const emergency = d.emergency.trim();
  if(emergency && !/^\d{10}$/.test(emergency)){ showErr('Emergency contact must be a valid 10-digit number.'); return; }
  if(emergency && emergency === mobile){ showErr('Emergency contact number must be different from the mobile number.'); return; }
  const email = d.email.trim().toLowerCase();
  if(email && CUSTOMERS.some(c => c.email === email)){ showErr('A customer with this email already exists.'); return; }

  const maxNum = CUSTOMERS.reduce((m,c) => Math.max(m, parseInt((c.id||'C0').replace('C',''),10) || 0), 0);
  const customer = {
    id: 'C' + (maxNum + 1),
    email, password: '',
    name: d.name.trim(),
    mobile, emergency,
    address: d.address.trim(),
    selfie: null, aadharFront: null, aadharBack: null, licenseFront: null, licenseBack: null,
    createdAt: new Date().toISOString(),
    verificationStatus: 'pending',
    addedByAdmin: true,
  };
  CUSTOMERS.push(customer);
  saveCustomers();
  notifiedCustomerIds.add(customer.id); // this device created it -- no local popup needed
  newCustomerDraft = null;
  renderAdmin();
}

function updateNewBookingDraftField(field, val){
  if(field === 'kmPackage'){
    newBookingDraft[field] = val === 'custom' ? 'custom' : parseInt(val, 10);
  } else if(field === 'customKm'){
    newBookingDraft[field] = val;
  } else if(['pickupCharge','dropCharge','helmetCharge','discountValue'].includes(field)){
    const n = parseFloat(val);
    newBookingDraft[field] = isNaN(n) || n < 0 ? 0 : n;
  } else if(field === 'discountType'){
    newBookingDraft[field] = val;

  }
  renderAdmin();
}
// Resolves the manual booking's effective km figure -- the picked plan, or the admin's
// free-typed number when "Other (enter manually)" is selected.
function effectiveNewBookingKm(d){
  if(d.kmPackage === 'custom'){
    const n = parseInt(d.customKm, 10);
    return isNaN(n) || n <= 0 ? 0 : n;
  }
  return d.kmPackage;
}
function newBookingDiscountAmount(d, rentBeforeDiscount){
  if(!d.discountValue) return 0;
  const amt = d.discountType === 'percent' ? (rentBeforeDiscount * d.discountValue / 100) : d.discountValue;
  return Math.min(Math.max(amt, 0), rentBeforeDiscount);
}

  const list = !q ? CUSTOMERS : CUSTOMERS.filter(c =>
    (c.name || '').toLowerCase().includes(q) ||
    (c.mobile || '').toLowerCase().includes(q) ||
    (c.email || '').toLowerCase().includes(q)
  );
  const placeholder = `<option value="">${list.length ? 'Select a customer…' : 'No matching customers'}</option>`;
  return placeholder + list.map(c => `<option value="${c.id}" ${newBookingDraft.customerId===c.id?'selected':''}>${c.name} — ${c.mobile}</option>`).join('');
}
function filterNewBookingCustomers(val){
  newBookingCustomerSearch = val;

  if(el) el.innerHTML = newBookingCustomerOptionsHtml();
}
function onNewBookingCustomerSelect(val){

function saveNewBooking(){
  const d = newBookingDraft;
  const errEl = document.getElementById('new-booking-err');
  const showErr = msg => { errEl.textContent = msg; errEl.style.display = 'block'; };

  const customer = CUSTOMERS.find(c => c.id === d.customerId);
  const vehicle = VEHICLES.find(v => v.id === d.vehicleId);
  if(!customer){ showErr('Please select a customer.'); return; }
  if(!vehicle){ showErr('Please select a vehicle.'); return; }
  const plan = planForDates(d.pickupDate, d.pickupTime, d.dropDate, d.dropTime);
  if(plan.totalHours <= 0){ showErr('Please enter a valid pickup and drop-off date/time (drop-off must be after pickup).'); return; }
  const effectiveKm = effectiveNewBookingKm(d);
  if(!effectiveKm){ showErr('Please enter a valid km figure.'); return; }
  const billing = billingFor(vehicle, d.pickupDate, d.pickupTime, d.dropDate, d.dropTime, effectiveKm);
  const discountAmount = newBookingDiscountAmount(d, billing.total);

  const maxNum = BOOKINGS.reduce((m,bk) => Math.max(m, parseInt((bk.id||'BK0').replace('BK',''),10) || 0), 0);
  const booking = {
    id: 'BK' + (maxNum + 1),
    customerId: customer.id,
    customerName: customer.name,
    customerEmail: customer.email,
    customerMobile: customer.mobile,
    vehicleId: vehicle.id,
    vehicleName: vehicle.name,
    vehicleColour: vehicle.colour,
    vehicleRc: vehicle.rc,
    pickupDate: d.pickupDate, pickupTime: d.pickupTime,
    dropDate: d.dropDate, dropTime: d.dropTime,
    durationLabel: durationLabel(billing.totalHours),
    kmLabel: billing.isPureWeekly ? `${billing.includedKm} km included (700 km/week)` : `${effectiveKm} km${kmUnit(billing, effectiveKm)} · ${billing.includedKm} km included`,
    rentalTotal: billing.total + (d.pickupCharge||0) + (d.dropCharge||0) + (d.helmetCharge||0) - discountAmount,
    pickupCharge: d.pickupCharge || 0,
    dropCharge: d.dropCharge || 0,
    helmetCharge: d.helmetCharge || 0,
    discountType: discountAmount ? d.discountType : null,
    discountValue: discountAmount ? d.discountValue : 0,
    discountAmount: discountAmount,
    deposit: vehicle.deposit,
    extraKmCharge: vehicle.extraKm,
    paymentMethod: 'Cash / UPI / Card (collected at pickup/drop-off)',
    termsVersion: TERMS_VERSION,
    agreedAt: new Date().toISOString(),
    customerIp: 'Added by admin',
    customerGeo: 'Added by admin',
    addedByAdmin: true,
  };
  BOOKINGS.push(booking);
  saveBookings();
  notifiedBookingIds.add(booking.id); // this device created it -- no local popup needed
  const shouldShare = d.shareOnWhatsapp;
  newBookingDraft = null;
  renderAdmin();
  if(shouldShare){ shareBookingOnWhatsapp(booking.id); }
  sendInvoiceOnWhatsapp(booking.id, 'booking');
}

/* ============ EXTEND BOOKING ============
   Lets admin push a customer's drop-off date/time forward directly, add an optional
   extension charge, and send them a WhatsApp + in-app confirmation of the new return time. */
let extendDraft = null;

function addDaysToDateStr(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function toggleExtendForm(bookingId){
  if(extendDraft && extendDraft.bookingId === bookingId){
    extendDraft = null;
  } else {
    const bk = BOOKINGS.find(x => x.id === bookingId);
    if(!bk) return;
    extendDraft = {
      bookingId,
      newDropDate: addDaysToDateStr(bk.dropDate, 1),
      newDropTime: bk.dropTime,
      charge: 0,
      shareOnWhatsapp: true,
    };
  }
  renderAdmin();
}

function updateExtendDraftField(field, val){
  if(field === 'charge'){
    const n = parseFloat(val);
    extendDraft.charge = isNaN(n) || n < 0 ? 0 : n;
  } else {
    extendDraft[field] = val;
  }
  renderAdmin();
}

function renderExtendFormHtml(bk){
  const d = extendDraft;
  const newHours = hoursBetweenRaw(bk.pickupDate, bk.pickupTime, d.newDropDate, d.newDropTime);
  const vehicle = VEHICLES.find(v => v.id === bk.vehicleId);
  const dailyRateHint = vehicle ? `Reference: this vehicle's 150 km/day rate is ${money(vehicle.rate[150])}/day.` : '';
  return `
    <div class="add-card" style="margin-top:10px;">
      <h3>Extend booking ${bk.id}</h3>
      <p class="field-hint" style="margin-bottom:10px;">Current drop-off: ${fmtDate(bk.dropDate)}, ${fmtTime(bk.dropTime)}</p>
      <div class="avcard-fields wide" style="margin-bottom:8px;">

          <label>New drop off date</label>
          <input type="date" min="${bk.dropDate}" value="${d.newDropDate}" onchange="updateExtendDraftField('newDropDate', this.value)">
        </div>
        <div class="field">
          <label>New drop off time</label>
          <input type="time" value="${d.newDropTime}" onchange="updateExtendDraftField('newDropTime', this.value)">
        </div>

        <input type="number" min="0" value="${d.charge}" onchange="updateExtendDraftField('charge', this.value)">
        ${dailyRateHint ? `<p class="field-hint">${dailyRateHint}</p>` : ''}
      </div>
      ${newHours > 0 ? `<div class="note-box" style="margin-bottom:8px;">New total duration: <strong>${durationLabel(newHours)}</strong> · Extension charge: <strong>${money(d.charge)}</strong> · New rental total: <strong>${money(bk.rentalTotal + d.charge)}</strong></div>`
        : `<div class="err" style="display:block;margin-bottom:8px;">New drop-off must be after the current pickup.</div>`}
      <label style="display:flex;align-items:center;gap:8px;margin:4px 0 10px;font-size:12.5px;color:var(--text-dim);cursor:pointer;">
        <input type="checkbox" ${d.shareOnWhatsapp ? 'checked' : ''} onchange="extendDraft.shareOnWhatsapp=this.checked">
        Send extension confirmation on customer's WhatsApp + in-app notification
      </label>
      <div style="display:flex;gap:8px;">
        <button class="btn-primary" onclick="saveExtension()">Confirm extension</button>
        <button class="btn-ghost" onclick="toggleExtendForm('${bk.id}')">Cancel</button>
      </div>
    </div>
  `;
}

function saveExtension(){
  const d = extendDraft;
  const bk = BOOKINGS.find(x => x.id === d.bookingId);
  if(!bk) return;
  const newHours = hoursBetweenRaw(bk.pickupDate, bk.pickupTime, d.newDropDate, d.newDropTime);
  if(newHours <= 0){ alert('New drop-off must be after the current pickup date/time.'); return; }

  const oldDropDate = bk.dropDate, oldDropTime = bk.dropTime;
  bk.extensions = bk.extensions || [];
  bk.extensions.push({
    fromDate: oldDropDate, fromTime: oldDropTime,
    toDate: d.newDropDate, toTime: d.newDropTime,
    charge: d.charge,
    extendedAt: new Date().toISOString(),
  });
  bk.dropDate = d.newDropDate;
  bk.dropTime = d.newDropTime;
  bk.durationLabel = durationLabel(newHours);
  bk.rentalTotal = bk.rentalTotal + d.charge;
  bk.modifiedAt = new Date().toISOString();
  saveBookings();

  // In-app notification, same store the return/extension reminder buttons use.
  const notif = {
    id: 'NT' + Date.now() + Math.floor(Math.random() * 1000),
    bookingId: bk.id,
    customerId: bk.customerId,
    type: 'extension_confirmed',
    title: 'Your rental has been extended',
    body: `Hi ${bk.customerName}, your rental of the ${bk.vehicleName} (Booking ${bk.id}) has been extended to ${fmtDate(bk.dropDate)} at ${fmtTime(bk.dropTime)}.${d.charge ? ` Extension charge: ${money(d.charge)}.` : ''}`,
    createdAt: new Date().toISOString(),
    read: false,
  };
  NOTIFICATIONS.push(notif);
  saveNotifications();

  const shouldShare = d.shareOnWhatsapp;
  extendDraft = null;
  renderAdmin();

  if(shouldShare && bk.customerMobile){
    const num = bk.customerMobile.replace(/\D/g, '');
    const waMsg = `*24x7 Bike4U Bike Rentals*\n${notif.title}\n\n${notif.body}\n\nOriginal drop-off was ${fmtDate(oldDropDate)}, ${fmtTime(oldDropTime)}.`;
    window.open(`https://wa.me/91${num}?text=${encodeURIComponent(waMsg)}`, '_blank');
  }
  sendInvoiceOnWhatsapp(bk.id, 'extension');
}

function sendCustomerNotification(bookingId, type){
  const bk = BOOKINGS.find(x => x.id === bookingId);
  if(!bk){ return; }
  const isReturn = type === 'return';
  const title = isReturn ? 'Time to return your ride' : 'Need more time with your ride?';
  const body = isReturn
    ? `Hi ${bk.customerName}, your rental of the ${bk.vehicleName} (Booking ${bk.id}) is due for drop-off on ${fmtDate(bk.dropDate)} at ${fmtTime(bk.dropTime)}. Please return the vehicle on time to avoid late charges.`
    : `Hi ${bk.customerName}, if you'd like to extend your rental of the ${bk.vehicleName} (Booking ${bk.id}) beyond ${fmtDate(bk.dropDate)}, let us know and we'll help arrange it.`;

  const notif = {
    id: 'NT' + Date.now() + Math.floor(Math.random() * 1000),
    bookingId: bk.id,
    customerId: bk.customerId,
    type,
    title,
    body,
    createdAt: new Date().toISOString(),
    read: false,
  };
  NOTIFICATIONS.push(notif);
  saveNotifications();

  if(bk.customerMobile){
    const num = bk.customerMobile.replace(/\D/g, '');
    const waMsg = `*24x7 Bike4U Bike Rentals*\n${title}\n\n${body}`;
    window.open(`https://wa.me/91${num}?text=${encodeURIComponent(waMsg)}`, '_blank');
  } else {
    alert('Saved as an in-app notification, but this customer has no WhatsApp number on file to message them directly.');
  }
}

function shareBookingOnWhatsapp(id){
  const bk = BOOKINGS.find(x => x.id === id);
  if(!bk){ return; }
  if(!bk.customerMobile){
    alert('This customer has no mobile number on file -- add one to their profile first.');
    return;
  }
  const extras = (bk.pickupCharge||0) + (bk.dropCharge||0) + (bk.helmetCharge||0);
  const extrasLines = [];
  if(bk.pickupCharge) extrasLines.push(`Pickup charge: ${money(bk.pickupCharge)}`);
  if(bk.dropCharge) extrasLines.push(`Drop-off charge: ${money(bk.dropCharge)}`);
  if(bk.helmetCharge) extrasLines.push(`Extra helmet: ${money(bk.helmetCharge)}`);
  const lines = [
    `*24x7 Bike4U Bike Rentals*`,
    `Booking confirmed! 🎉`,
    ``,
    `Booking ID: ${bk.id}`,
    `Vehicle: ${bk.vehicleName} (${bk.vehicleColour})`,
    `Pickup: ${fmtDate(bk.pickupDate)}, ${fmtTime(bk.pickupTime)}`,
    `Drop-off: ${fmtDate(bk.dropDate)}, ${fmtTime(bk.dropTime)}`,
    `Duration: ${bk.durationLabel}`,
    `Kilometres: ${bk.kmLabel}`,
    ``,
    `Rent: ${money(bk.rentalTotal - extras)}`,
    ...extrasLines,
    `Deposit (refundable): ${money(bk.deposit)}`,
    `Extra km charge: ₹${bk.extraKmCharge}/km`,
    `Total: ${money(bk.rentalTotal)}`,
    ``,
    `Please bring a valid ID and your driving licence at pickup.`,
    `RENT IT, LIKE YOU OWN IT! 🏍️`
  ];
  const msg = lines.join('\n');
  const num = bk.customerMobile.replace(/\D/g,'');
  window.open(`https://wa.me/91${num}?text=${encodeURIComponent(msg)}`, '_blank');
}

function generateBookingAgreementPDF(id){
  const bk = BOOKINGS.find(x => x.id === id);
  if(!bk) return;
  if(!window.jspdf){
    alert('PDF library did not load -- check your internet connection and try again.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 40;
  let y = 50;

  // Brand colours (match the app's yellow/teal palette).
  const YELLOW = [245, 194, 27];
  const TEAL = [49, 182, 164];
  const DARK = [30, 34, 34];

  // Logo (top-left) + brand-coloured title.
  try{ doc.addImage(LOGO_BASE64, 'PNG', margin, y - 26, 34, 34); }catch(e){}
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.setTextColor(...TEAL);
  doc.text('24x7 Bike4u', margin + 42, y - 6);
  doc.setFontSize(12);
  doc.setTextColor(...DARK);
  doc.text('Rental Agreement', margin + 42, y + 12);
  doc.setTextColor(0, 0, 0);
  y += 30;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text(`Agreement ID: ${bk.id}    Terms version: ${bk.termsVersion}`, margin, y);
  y += 14;
  if(bk.modifiedAt){
    doc.text(`(Booking last modified by admin on ${fmtDate(bk.modifiedAt.slice(0,10))} at ${fmtTime(bk.modifiedAt.slice(11,16))})`, margin, y);
    y += 14;
  }
  y += 4;

  doc.setDrawColor(...YELLOW);
  doc.setLineWidth(2);
  doc.line(margin, y, pageW - margin, y);
  doc.setLineWidth(1);
  y += 24;

  const fields = [
    ['Customer name', bk.customerName],
    ['Customer email', bk.customerEmail],
    ['Customer mobile', bk.customerMobile],
    ['Vehicle', `${bk.vehicleName} (${bk.vehicleColour}, ${bk.vehicleRc})`],
    ['Pickup', `${fmtDate(bk.pickupDate)}, ${fmtTime(bk.pickupTime)}`],
    ['Drop-off', `${fmtDate(bk.dropDate)}, ${fmtTime(bk.dropTime)}`],
    ['Duration', bk.durationLabel],
    ['Kilometres', bk.kmLabel],
    ...(bk.couponCode ? [['Coupon applied', `${bk.couponCode} (-${money(bk.couponDiscount)})`]] : []),
    ['Rental total', money(bk.rentalTotal)],
    ['Deposit (refundable)', money(bk.deposit)],
    ['Extra km charge', `₹${bk.extraKmCharge}/km`],
    ['Payment method', bk.paymentMethod],
  ];
  doc.setFontSize(11);
  fields.forEach(([label, value]) => {
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...TEAL);
    doc.text(label + ':', margin, y);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(...DARK);
    const lines = doc.splitTextToSize(String(value), pageW - margin*2 - 160);
    doc.text(lines, margin + 160, y);
    y += Math.max(16, lines.length * 14);
  });
  doc.setTextColor(0, 0, 0);

  y += 10;
  doc.setDrawColor(200);
  doc.line(margin, y, pageW - margin, y);
  y += 20;

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(...TEAL);
  doc.text('Terms & Conditions', margin, y);
  doc.setTextColor(0, 0, 0);
  y += 18;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9.5);
  const termsLines = doc.splitTextToSize(TERMS_TEXT, pageW - margin*2);
  termsLines.forEach(line => {
    if(y > pageH - margin - 14){
      doc.addPage();
      y = 50;
    }
    doc.text(line, margin, y);
    y += 12.5;
  });

  y += 12;
  if(y > pageH - margin - 90){ doc.addPage(); y = 50; }
  doc.setDrawColor(...YELLOW);
  doc.setLineWidth(2);
  doc.line(margin, y, pageW - margin, y);
  doc.setLineWidth(1);
  y += 22;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(...TEAL);
  doc.text('Customer acceptance', margin, y);
  doc.setTextColor(0, 0, 0);
  y += 18;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text(`Digitally agreed by ${bk.customerName} (${bk.customerEmail}) via in-app checkbox acknowledgment.`, margin, y);
  y += 15;
  doc.text(`Agreed on (real-time device timestamp): ${fmtDate(bk.agreedAt.slice(0,10))} at ${fmtTime(bk.agreedAt.slice(11,16))}`, margin, y);
  y += 15;
  doc.text(`Customer IP address at time of booking: ${bk.customerIp || 'Not recorded'}`, margin, y);
  y += 15;
  doc.text(`Geo-tag location at time of booking: ${bk.customerGeo || 'Not recorded'}`, margin, y);

  doc.save(`Bike4u-Agreement-${bk.customerName.replace(/\s+/g,'_')}-${bk.id}.pdf`);
}

/* ============ INVOICES ============
   A compact, itemised invoice PDF -- separate from the full rental agreement above --
   auto-generated the moment a booking is created, and again every time it's extended
   (each extension gets its own invoice showing just that extra charge, plus the running
   total). Real-time, silent WhatsApp delivery isn't something a plain website can do --
   no browser lets a page message someone on WhatsApp without a human tapping Send, and
   that requires WhatsApp's paid Business API running on a server, not a static site. This
   gets as close as a browser allows: it builds the PDF automatically and, on a phone,
   hands it straight to WhatsApp via the native share sheet so sending it is one tap instead
   of a manual "open WhatsApp, attach file, find chat, send". */
function invoiceLineItems(bk, extension){
  const items = [];
  const baseRent = bk.rentalTotal - (bk.pickupCharge||0) - (bk.dropCharge||0) - (bk.helmetCharge||0) + (bk.discountAmount||0) + (bk.couponDiscount||0)
    - (bk.extensions || []).reduce((s,e) => s + (e.charge||0), 0);
  items.push(['Rent', bk.kmLabel, money(baseRent)]);
  if(bk.pickupCharge) items.push(['Pickup charge', '', money(bk.pickupCharge)]);
  if(bk.dropCharge) items.push(['Drop-off charge', '', money(bk.dropCharge)]);
  if(bk.helmetCharge) items.push(['Extra helmet', '', money(bk.helmetCharge)]);
  (bk.extensions || []).forEach((e, i) => {
    if(e.charge) items.push([`Extension ${i+1}`, `to ${fmtDate(e.toDate)}, ${fmtTime(e.toTime)}`, money(e.charge)]);
  });
  if(bk.couponCode) items.push([`Coupon (${bk.couponCode})`, '', `-${money(bk.couponDiscount)}`]);
  if(bk.discountAmount) items.push(['Discount', bk.discountType === 'percent' ? `${bk.discountValue}%` : '', `-${money(bk.discountAmount)}`]);
  return items;
}

  const margin = 40;
  let y = 50;
  const YELLOW = [245, 194, 27];
  const TEAL = [49, 182, 164];
  const DARK = [30, 34, 34];

  try{ doc.addImage(LOGO_BASE64, 'PNG', margin, y - 26, 34, 34); }catch(e){}
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.setTextColor(...TEAL);
  doc.text('24x7 Bike4u', margin + 42, y - 6);
  doc.setFontSize(12);
  doc.setTextColor(...DARK);
  doc.text(kind === 'extension' ? 'Extension Invoice' : 'Booking Invoice', margin + 42, y + 12);

  y += 22;

   ['Vehicle', `${bk.vehicleName} (${bk.vehicleColour}, ${bk.vehicleRc})`],
   ['Pickup', `${fmtDate(bk.pickupDate)}, ${fmtTime(bk.pickupTime)}`],

// Builds the invoice and hands it to WhatsApp -- via the phone's native share sheet
// (one tap, file pre-attached) when available, otherwise downloads the PDF and opens a
// WhatsApp chat with the customer so the admin can attach it themselves.
function sendInvoiceOnWhatsapp(id, kind, extension){
  ensureJsPDFThen(function(){
    const result = generateInvoicePDF(id, kind, extension);
    if(!result) return;
    const { doc, bk } = result;
    const filename = `Bike4u-Invoice-${bk.customerName.replace(/\s+/g,'_')}-${bk.id}${kind==='extension' ? '-ext' : ''}.pdf`;
    const waNum = (bk.customerMobile || '').replace(/\D/g, '');
    const caption = kind === 'extension'
      ? `*24x7 Bike4U Bike Rentals*\nHere's your updated invoice after the extension on Booking ${bk.id}.\nNew total: ${money(bk.rentalTotal)}`
      : `*24x7 Bike4U Bike Rentals*\nHere's your invoice for Booking ${bk.id}.\nTotal: ${money(bk.rentalTotal)}`;

    let shared = false;
    try{
      const blob = doc.output('blob');
      const file = new File([blob], filename, { type: 'application/pdf' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        navigator.share({ files: [file], title: filename, text: caption }).catch(() => {});
        shared = true;
      }
    }catch(e){ /* Web Share API with files not supported here -- fall through */ }

    if(!shared){
      doc.save(filename);
      if(waNum){
        window.open(`https://wa.me/91${waNum}?text=${encodeURIComponent(caption + '\n\n(Invoice PDF just downloaded on this device -- attach it here to send.)')}`, '_blank');
      }
    }
  });
}
